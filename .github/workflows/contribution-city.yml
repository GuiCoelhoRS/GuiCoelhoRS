name: publish-contribution-city
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: contribution-city-output
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check out the action and publishing example
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: myfear/quarkus-contribution-city
          ref: v1
          path: .city-action
          persist-credentials: false
      - name: Generate contribution city
        id: city
        uses: ./.city-action
        with:
          github-token: ${{ secrets.CONTRIBUTION_TOKEN || secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
      - name: Publish only changed SVGs
        shell: bash
        run: bash .city-action/examples/publish-output.sh
